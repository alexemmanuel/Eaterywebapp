<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Guard against third-party browser extension injection collisions (e.g. EVM wallet extensions redefining window.ethereum) */
      (function() {
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event.message && (
              event.message.indexOf('ethereum') !== -1 ||
              event.message.indexOf('Cannot redefine property') !== -1
            ))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var msg = event && event.reason && (event.reason.message || String(event.reason));
          if (msg && (msg.indexOf('ethereum') !== -1 || msg.indexOf('Cannot redefine property') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        try {
          var currentEth = window.ethereum;
          Object.defineProperty(window, 'ethereum', {
            configurable: true,
            enumerable: true,
            get: function() { return currentEth; },
            set: function(val) { currentEth = val; }
          });
        } catch (err) {
          /* Handled gracefully if locked by extension */
        }
      })();
    </script>
    <title>Onitawa's Catering & Eatery</title>
